name: Reserve Check

on:
  schedule:
    # 日本時間 07:00 - 21:00 の間、30分おきに実行
    # 00分実行: UTC 22:00 (JST 07:00) から UTC 12:00 (JST 21:00)
    - cron: '4 22,23,0-12 * * *'
    # 30分実行: UTC 22:30 (JST 07:30) から UTC 12:30 (JST 21:30)
    - cron: '34 22,23,0-11 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      TARGET_DATES: ${{ vars.TARGET_DATES }}
      TZ: 'Asia/Tokyo'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        
      - name: Run Check
        run: npm run check
